# dsh-web-search bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package.
# Installing the package with:
#
#   dsh plugin --profile <name> add dsh-web-search
#
# reconciles `dsh.profile.bundles` against installed packages and, seeing the
# `dsh.bundle.patch` declaration, appends this package to the bundle stack.
# The profile boot then merges THIS patch exactly like a manual
# cordis.patch.yml mount. No profile edits needed to get running.
#
# It inserts the plugin row (vendor selection + API keys go in its config —
# override this same row id in your profile cordis.patch.yml to configure)
# and points the web seam at the plugin's fixed provider ids. The web-fetch
# default stays on the built-in anonymous `http` provider (free, no vendor
# credits); set `fetchProvider: dsh-web-fetch` in your profile patch after
# configuring `fetch:` in the plugin config.
- insert:
    - id: web-search
      name: 'dsh-web-search'
      config:
        # Vendor for web_search. Registered vendors: tavily, firecrawl.
        # Add your own in lib/providers/ + lib/registry.js.
        search: tavily
        # Vendor for web_fetch. Omit (default) to register no fetch provider.
        # fetch: tavily
        providers:
          tavily: {}
          # firecrawl:
          #   apiKey: 'fc-...'   # or export FIRECRAWL_API_KEY

- id: web
  config:
    searchProvider: dsh-web-search
    fetchProvider: http
